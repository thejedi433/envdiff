[project]
name = "envdiff"
version = "0.1.0"
description = "Compare .env files across environments and find missing or mismatched keys."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
envdiff = "envdiff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]
